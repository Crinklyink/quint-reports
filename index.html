<script>
const env = JSON.parse(atob(document.getElementById("payload").textContent.trim()));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "decrypting…";
  try {
    const base = await crypto.subtle.importKey("raw",
      new TextEncoder().encode(document.getElementById("pw").value),
      "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(env.salt), iterations:env.iter, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(env.iv) }, key, b64(env.ct));
    const html = new TextDecoder().decode(pt);
    const frame = document.createElement("iframe");
    // The report lets you click a ticker to copy it; a srcdoc iframe needs
    // this explicitly or the Clipboard API is blocked inside it.
    frame.setAttribute("allow", "clipboard-write");
    frame.srcdoc = html;
    document.body.replaceChildren(frame);
  } catch (_) {
    err.textContent = "Wrong password.";
  }
