<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Quintisential — Nightly Results</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0a0a0b;color:#f5f3ef;
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #gate{max-width:23rem;margin:20vh auto;padding:1.9rem 1.7rem;background:#131316;
        border:1px solid rgba(255,255,255,.09);border-radius:2px}
  .brand{font-size:.62rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
         color:#c8a96a;margin:0 0 .9rem}
  h1{font:400 1.5rem/1.2 ui-serif,"Iowan Old Style",Georgia,serif;margin:0 0 .4rem}
  p{margin:0 0 1.3rem;color:#a8a49c;font-size:.83rem}
  input,button{width:100%;box-sizing:border-box;font-size:.95rem;padding:.62rem .7rem;
               border-radius:2px;border:1px solid rgba(255,255,255,.16);
               background:#0a0a0b;color:#f5f3ef}
  button{margin-top:.55rem;background:#3987e5;border-color:#3987e5;color:#fff;
         font-weight:650;cursor:pointer}
  button:hover{background:#4a93ea}
  #err{color:#d03b3b;font-size:.79rem;min-height:1.1em;margin-top:.6rem}
  iframe{border:0;width:100vw;height:100vh;display:block;background:#0a0a0b}
</style>
</head>
<body>
<div id="gate">
  <p class="brand">Quintisential</p>
  <h1>Nightly results</h1>
  <p>Enter the password to decrypt this report in your browser.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" autofocus placeholder="Password">
    <button type="submit">Unlock</button>
  </form>
  <div id="err"></div>
</div>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Always fetch the newest payload: the query string defeats the browser and
// CDN cache, and no-store stops it being written back to either.
async function loadEnvelope(){
  const r = await fetch("payload.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("payload " + r.status);
  return r.json();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "decrypting…";
  try {
    const env = await loadEnvelope();
    const base = await crypto.subtle.importKey("raw",
      new TextEncoder().encode(document.getElementById("pw").value),
      "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(env.salt), iterations:env.iter, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(env.iv) }, key, b64(env.ct));
    const html = new TextDecoder().decode(pt);
    const frame = document.createElement("iframe");
    // The report lets you click a ticker to copy it; a srcdoc iframe needs
    // this explicitly or the Clipboard API is blocked inside it.
    frame.setAttribute("allow", "clipboard-write");
    frame.srcdoc = html;
    document.body.replaceChildren(frame);
  } catch (_) {
    err.textContent = "Wrong password.";
  }
});
</script>
</body>
</html>
